name: Purge All Actions Artifacts

on:
  push:
    paths:
      - '.github/workflows/purge-all-artifacts.yml'

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every Actions artifact and verify empty
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            let deleted = 0; let bytes = 0;
            for (const artifact of artifacts) { bytes += artifact.size_in_bytes || 0; await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id }); deleted += 1; }
            const remaining = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const result = [`repo=${owner}/${repo}`,`deleted_count=${deleted}`,`deleted_bytes=${bytes}`,`remaining_count=${remaining.length}`].join('\n') + '\n';
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: 'artifact-purge-result.txt', message: 'chore: record full artifact purge result', content: Buffer.from(result).toString('base64'), branch: context.ref.replace('refs/heads/', '') });
            if (remaining.length !== 0) core.setFailed(`Artifacts remain after purge: ${remaining.length}`);
